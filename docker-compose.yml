services:
  # Con este servicio en el compose, spring-boot-docker-compose ignora spring.datasource.url y
  # se conecta solo al contenedor, con la base y la contraseña de abajo.
  # 3307 afuera y no 3306: asi no choca con un MySQL instalado en la maquina
  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zaguan_inmobiliarias
    labels:
      # La misma zona horaria que tiene spring.datasource.url
      org.springframework.boot.jdbc.parameters: "serverTimezone=America/Argentina/Buenos_Aires"
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
    # Las imagenes oficiales de MinIO ya no se pueden bajar (quay.io da 401, Docker Hub las
    # saco). pgsty/minio es un fork comunitario con el mismo binario y los mismos comandos
    image: pgsty/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  minio-data:
