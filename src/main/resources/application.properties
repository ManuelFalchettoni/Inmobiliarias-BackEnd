spring.application.name=zaguan-inmobiliarias

# ---------- Datasource ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zaguan_inmobiliarias}?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Paginacion ----------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------- Docker ----------
# La app hace docker compose up al arrancar. start-only: al apagarla el contenedor sigue
# corriendo, asi los reinicios de devtools no lo bajan y lo vuelven a levantar
spring.docker.compose.lifecycle-management=start-only

# ---------- Fotos (MinIO) ----------
minio.url=${MINIO_URL:http://localhost:9000}
minio.user=${MINIO_USER:admin}
minio.password=${MINIO_PASSWORD:admin12345}
minio.bucket=${MINIO_BUCKET:photos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# ---------- CORS ----------
# Origenes del front. Varios separados por coma.
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ---------- JWT ----------
# Minimo 32 caracteres (256 bits): con menos, JJWT tira WeakKeyException y el login da 500
jwt.secret=${JWT_SECRET:zaguan-local-secret-0123456789abcdef}
# En milisegundos: 86400000 = 24 horas
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- Email ----------
# Sin spring.mail.host Spring no crea el JavaMailSender y la app no arranca
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
# En milisegundos. Sin timeouts, un SMTP colgado deja trabado al job de recordatorios para siempre
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@zaguan.com}
# Con cuantas horas de anticipacion se avisa que una alerta esta por vencer
app.crm-alerts.reminder-hours=${CRM_ALERT_REMINDER_HOURS:24}
# Cada cuanto se buscan alertas para avisar, en milisegundos: 300000 = 5 minutos
app.crm-alerts.check-interval-ms=${CRM_ALERT_CHECK_INTERVAL_MS:300000}

# ---------- Datos de prueba ----------
# Carga datos de prueba al arrancar (config/DataSeeder), solo si la base esta vacia. SEED_ENABLED=false lo apaga
app.seed.enabled=${SEED_ENABLED:true}
# Cuantas propiedades (y personas) generadas se suman a los datos fijos. 0 = solo los datos fijos
app.seed.properties=${SEED_PROPERTIES:150}
app.seed.people=${SEED_PEOPLE:200}
# Fotos de muestra por propiedad generada (salen de resources/seed-photos)
app.seed.photos-per-property=${SEED_PHOTOS_PER_PROPERTY:4}
